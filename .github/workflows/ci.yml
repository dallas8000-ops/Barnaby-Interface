name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no voice extras; tests use fakes)
        run: python -m pip install -e engine ruff
      - name: Lint
        run: ruff check engine/barnaby_engine engine/tests --select E,F,W,B --ignore E501,B011
      - name: Unit tests
        working-directory: engine
        run: python -m unittest discover -s tests -t . -v

  app:
    name: UI (typecheck, Vitest, Playwright E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e engine
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run typecheck
      - working-directory: app
        run: npm test
      - working-directory: app
        run: npx playwright install --with-deps chromium
      - name: E2E (real engine process, scripted agent harness)
        working-directory: app
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results

  shell:
    name: Desktop shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app
        run: npm ci && npm run build
      - working-directory: app/src-tauri
        run: cargo clippy -- -D warnings
